name: ServiceNow DevOps Pipeline
on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy to Prod
    runs-on: ubuntu-latest
    steps:
      - name: ServiceNow DevOps Change Request
        id: create-change
        uses: ServiceNow/servicenow-devops-change@v6.1.0
        with:
          instance-url: ${{ secrets.SN_INSTANCE_URL }}
          devops-integration-token: ${{ secrets.SN_DEVOPS_INTEGRATION_TOKEN }}
          tool-id: ${{ secrets.SN_ORCHESTRATION_TOOL_ID }}
          context-github: ${{ toJSON(github) }}
          job-name: 'Deploy to Prod'
          change-request: >-
            {"setCloseCode":"true","autoCloseChange":true,"attributes":{
              "short_description":"Despliegue GitHub",
              "description":"Cambio generado automáticamente desde GitHub. Actualización",
              "implementation_plan":"Despliegue automatizado via CI/CD",
              "backout_plan":"Re-despliegue de versión anterior",
              "test_plan":"Validación post-despliegue"
            }}
          interval: '100'
          timeout: '3600'
          changeCreationTimeOut: '3600'
          abortOnChangeCreationFailure: true
          abortOnChangeStepTimeout: true

      - name: Output del Change Request
        run: echo "CHG=${{ steps.create-change.outputs.change-request-number }}" >> $GITHUB_OUTPUT
